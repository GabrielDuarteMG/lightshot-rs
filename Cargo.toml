[package]
name = "lightshot"
version = "0.1.0"
edition = "2021"
authors = ["Gabriel"]
license = "MIT"
repository = "https://github.com/GabrielDuarteMG/lightshot-rs"

[dependencies]
eframe = "0.37"
xcap = "0.9"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
toml = "1"
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
